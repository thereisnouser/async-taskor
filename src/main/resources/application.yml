spring:
  application:
    name: async-taskor
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

application:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    accessKey: ${MINIO_ACCESS_KEY}
    secretKey: ${MINIO_SECRET_KEY}
    bucket:
      src: ${MINIO_BUCKET_SRC:images-input}
      dst: ${MINIO_BUCKET_DST:images-output}
