version: "3.8"
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: http://minio:9000
    volumes:
      - ./minio-data:/data

  create-buckets:
    image: minio/mc:latest
    depends_on: [ minio ]
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
    entrypoint: >
      /bin/sh -c "
      until mc ls local >/dev/null 2>&1; do echo 'Waiting for MinIO...'; sleep 2; done &&
      mc mb -p local/images-input || true &&
      mc mb -p local/images-output || true
      "